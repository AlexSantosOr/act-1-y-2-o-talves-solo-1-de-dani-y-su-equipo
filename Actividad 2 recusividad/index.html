<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de la Serie de Fibonacci</title>
    <style>
        :root {
            --orange-primary: #f57c00;
            --orange-light: #ffe0b2;
            --bg-color: #fff3e0;
            --text-color: #3e2723;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 { color: var(--orange-primary); }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid var(--orange-light);
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--orange-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover { background-color: #ef6c00; }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background-color: var(--orange-light);
            word-wrap: break-word;
        }

        .error { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Generador de Fibonacci</h1>
    <input type="number" id="nInput" placeholder="Ingrese cantidad n (n >= 0)" min="0">
    <button onclick="handleGenerate()">Generar Serie</button>
    <div id="result"></div>
</div>

<script>
    /**
     * Función RECURSIVA para calcular el n-ésimo término de Fibonacci.
     * Caso base: F(0) = 0, F(1) = 1.
     * Recursión: F(n) = F(n-1) + F(n-2).
     */
    function fibonacci(n) {
        // Casos base: F(0) = 0 y F(1) = 1
        if (n === 0) return 0;
        if (n === 1) return 1;
        // Llamada recursiva: sumamos los dos términos anteriores
        return fibonacci(n - 1) + fibonacci(n - 2);
    }

    function handleGenerate() {
        const input = document.getElementById('nInput').value;
        const resDiv = document.getElementById('result');
        const n = parseInt(input);

        // Validación: debe ser un número entero mayor o igual a 0
        if (isNaN(n) || n < 0) {
            resDiv.innerHTML = '<p class="error">Error: Por favor, ingrese un número entero positivo (>= 0).</p>';
            return;
        }

        // Generar la serie desde 0 hasta n
        let series = [];
        for (let i = 0; i <= n; i++) {
            series.push(fibonacci(i));
        }

        resDiv.innerHTML = `<strong>Serie para n=${n}:</strong><br>${series.join(', ')}`;
    }
</script>

</body>
</html>
